<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="steadwatch-icon-title">
    <title id="steadwatch-icon-title">Steadwatch</title>
    <defs>
        <linearGradient id="steadwatch-plate-light" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#F1F5F9"/>
        </linearGradient>
        <linearGradient id="steadwatch-plate-dark" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
            <stop stop-color="#172238"/>
            <stop offset="1" stop-color="#0E1626"/>
        </linearGradient>
        <style>
            .steadwatch-plate { fill: url(#steadwatch-plate-light); stroke: #E2E8F0; }
            .steadwatch-pulse { stroke: #2F4A7D; }
            @media (prefers-color-scheme: dark) {
                .steadwatch-plate { fill: url(#steadwatch-plate-dark); stroke: #1F2A3D; }
                .steadwatch-pulse { stroke: #8FA9E0; }
            }
        </style>
    </defs>
    <rect class="steadwatch-plate" x="4.5" y="4.5" width="55" height="55" rx="14" stroke-width="1"/>
    <path class="steadwatch-pulse" d="M14 32h9.5l4.2-9.5 6.1 19 4.7-13.2 2.8 3.7H50" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
